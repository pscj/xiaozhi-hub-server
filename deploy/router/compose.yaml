# Optional. Docker 20.10 can use build.sh / start.sh without Compose.
services:
  hub:
    build:
      context: ../..
      dockerfile: deploy/router/Dockerfile
    image: xiaozhi-hub-router:local
    container_name: xiaozhi-hub
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      HUB_PUBLIC_HOST: ${LAN_IP:?请设置LAN_IP为路由器局域网IPv4地址}
      HUB_DEFAULT_LLM: ${HUB_DEFAULT_LLM:-ClaudeAPI}
    ports:
      - "${LAN_IP}:16688:16688"
      - "${LAN_IP}:16689:16689"
    volumes:
      # Read code from the checkout; dependencies remain in the image.
      - ../../main/xiaozhi-server/core:/opt/xiaozhi-hub/main/xiaozhi-server/core:ro
      - ./data:/opt/xiaozhi-hub/main/xiaozhi-server/data
      - ./tmp:/opt/xiaozhi-hub/main/xiaozhi-server/tmp
      - ./home:/home/xiaozhi
      - models:/opt/xiaozhi-hub/main/xiaozhi-server/models
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
volumes:
  models:
    name: xiaozhi-hub-models
